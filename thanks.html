<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 | You Edit</title>
    <meta name="description" content="You Editへのお問い合わせ送信が完了しました。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                        serif: ['Noto Serif JP', 'Georgia', 'serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#1E293B',
                            navyDark: '#0F172A',
                            accent: '#D97706',
                            bgLight: '#FBFBFA',
                            beige: '#F4F4F0',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-brand-bgLight text-slate-800 antialiased">
    <main class="min-h-screen flex items-center justify-center px-6 py-16">
        <section class="w-full max-w-2xl rounded-2xl border border-slate-200 bg-white p-8 sm:p-12 text-center shadow-lg">
            <div class="mx-auto mb-6 flex h-14 w-14 items-center justify-center rounded-full bg-amber-50 text-brand-accent">
                <i data-lucide="check" class="h-7 w-7"></i>
            </div>
            <p class="text-xs font-bold uppercase tracking-widest text-brand-accent">Thank You</p>
            <h1 class="mt-3 text-3xl sm:text-4xl font-extrabold font-serif text-brand-navy">送信が完了しました</h1>
            <p class="mt-5 text-sm sm:text-base leading-relaxed text-slate-600">
                お問い合わせありがとうございます。内容を確認後、通常1〜2営業日以内にご連絡します。
            </p>
            <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
                <a href="index.html" class="inline-flex items-center justify-center rounded-xl bg-brand-navy px-7 py-3.5 text-sm font-bold tracking-wider text-white transition hover:bg-brand-accent">
                    トップページへ戻る
                </a>
                <a href="mailto:info@you-edit.com" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-7 py-3.5 text-sm font-bold tracking-wider text-slate-700 transition hover:bg-slate-50">
                    メールで追加連絡する
                </a>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
